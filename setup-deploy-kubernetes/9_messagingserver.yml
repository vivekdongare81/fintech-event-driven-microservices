apiVersion: apps/v1
kind: Deployment
metadata:
  name: messagingserver-deployment
  labels:
    app: messagingserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: messagingserver
  template:
    metadata:
      labels:
        app: messagingserver
    spec:
      containers:
      - name: messagingserver
        image: devsoncall/messagingserver:v5.0_messagingServer
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS
          value: kafka:9092
        - name: SPRING_APPLICATION_NAME
          valueFrom:
            configMapKeyRef:
              name: devsoncall-configmap
              key: MESSAGING_APPLICATION_NAME
        - name: SPRING_PROFILES_ACTIVE
          valueFrom: 
            configMapKeyRef:
              name: devsoncall-configmap
              key: SPRING_PROFILES_ACTIVE
        - name: SPRING_CONFIG_IMPORT
          valueFrom: 
            configMapKeyRef:
              name: devsoncall-configmap
              key: SPRING_CONFIG_IMPORT
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          valueFrom: 
            configMapKeyRef:
              name: devsoncall-configmap
              key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
---
apiVersion: v1
kind: Service
metadata:
  name: messagingserver
spec:
  selector:
    app: messagingserver
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 8000 #Expose TODO change
      targetPort: 8080
