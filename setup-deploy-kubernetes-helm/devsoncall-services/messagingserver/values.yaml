# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

deploymentName: messagingserver-deployment
serviceName: messagingserver
appLabel: messagingserver
appName: messagingserver

replicaCount: 1

image:
  repository: devsoncall/messagingserver
  tag: v5.0_messagingServer

containerPort: 9010

service:
  type: ClusterIP
  port: 9010
  targetPort: 9010

appname_enabled: true
profile_enabled: false
config_enabled: false
eureka_enabled: false
resouceserver_enabled: false
otel_enabled: false
kafka_enabled: true